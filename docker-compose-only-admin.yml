services:
  navi-admin-db:
    image: navi-admin-db:local
    container_name: navi-admin-db
    build:
      context: .
      dockerfile: ./local_setting/local_db/Dockerfile
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - 33307:3306
    volumes:
      - ./local_data/mysql:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=db_local
      - MYSQL_USER=navi_admin_user
      - MYSQL_PASSWORD=password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - navi-admin-network

  navi-admin-web:
    image: navi-admin-web:local
    container_name: navi-admin-web
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./docker/local/Dockerfile
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        while ! nc -z navi-admin-db 3306; do
          sleep 1
        done &&
        echo 'Database is ready!' &&
        python manage.py runserver 0.0.0.0:8004
      "
    volumes:
      - .:/app
      - ./local_setting/local_app/llm_models:/models:ro
    ports:
      - 8004:8004
    environment:
      - DJANGO_SETTINGS_MODULE=terao_navi_web.settings
      - PYTHONUNBUFFERED=1
      - DB_HOST=navi-admin-db
      - DB_NAME=db_local
      - DB_USER=navi_admin_user
      - DB_PASSWORD=password
      - DB_POST=3306
      - AWS_S3_ENDPOINT_URL=http://navi-admin-s3:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - VECTOR_PG_CONNECTION=postgresql+psycopg://vector_user:vector_password@vector-admin-db:5432/vector_db
      - VECTOR_EMBEDDINGS_PROVIDER=local
      - HF_EMBEDDING_MODEL=/models/bge-m3
      - HF_EMBEDDINGS_DEVICE=cpu
      - OPENAI_API_KEY=
      - OPENAI_EMBEDDING_MODEL=
    depends_on:
      navi-admin-db:
        condition: service_healthy
    networks:
      - navi-admin-network
    restart: unless-stopped
  
  navi-admin-s3:
    image: minio/minio
    container_name: navi-admin-s3
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./local_data/minio:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    networks:
      - navi-admin-network
    restart: always

  minio-init:
    image: minio/mc
    depends_on:
      - navi-admin-s3
    entrypoint: >
      sh -c "/init/create_bucket.sh"
    volumes:
      - ./local_setting/local_s3:/init
    networks:
      - navi-admin-network
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8013:80"
    environment:
      PMA_HOST: navi-admin-db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    networks:
      - navi-admin-network
    depends_on:
      navi-admin-db:
        condition: service_healthy
    restart: always
  
  vector-admin-db:
    image: pgvector/pgvector:pg16
    container_name: vector-admin-db
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=vector_user
      - POSTGRES_PASSWORD=vector_password
      - POSTGRES_DB=vector_db
    volumes:
      - ./local_data/vector_db:/var/lib/postgresql/data
      - ./local_setting/local_postgre/create_tables.sh:/docker-entrypoint-initdb.d/init.sh
    networks:
      - navi-admin-network
  
  vector-admin-db-admin:
    image: dpage/pgadmin4
    container_name: vector-admin-db-admin
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    volumes:
      - ./local_data/pgadmin:/var/lib/pgadmin
    networks:
      - navi-admin-network
    depends_on:
      - vector-admin-db

networks:
  navi-admin-network:
    driver: bridge

volumes:
  minio-data: